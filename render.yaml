services:
  # FastAPI backend service
  - type: web
    name: learning-engine-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && python backend/data/train_assistments.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URI
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/learning_engine.db
      - key: DATABASE_URL
        sync: false
    healthCheckPath: /health
    # SQLite needs a persistent disk in production. Attach a Render disk at /var/data.
    disk:
      name: learning-engine-data
      mountPath: /var/data
      sizeGB: 1

  # Vite frontend static site
  - type: web
    name: learning-engine-frontend
    env: static
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
